<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Sales Data - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <div class="page-header"
            style="padding: 10px; background: #fff; border-bottom: 1px solid #eee; margin-bottom: 20px;">
            <a href="merchant.html" style="text-decoration: none; color: inherit;">
                <i class="fas fa-arrow-left" style="cursor:pointer; font-size: 20px; margin-right: 10px;"></i>
            </a>
            <span style="font-size: 18px; font-weight: bold;">Sales Data</span>
        </div>
        <div id="sales-data-content" style="padding: 20px;">

        </div>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        const currentRestaurantId = 1;

        window.onload = function () {
            renderSales();
        };

        function renderSales() {
            const container = document.getElementById('sales-data-content');
            const orders = MockDB.getOrdersByRestaurant(currentRestaurantId);

            const totalOrders = orders.length;
            const totalRevenue = orders.reduce((sum, order) => sum + order.TotalAmount, 0);

            const html = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div style="background:#f9f9f9; padding:20px; border-radius:10px; text-align:center;">
                        <div style="font-size:14px; color:#666;">Total Orders</div>
                        <div style="font-size:24px; font-weight:bold; color:#333;">${totalOrders}</div>
                    </div>
                    <div style="background:#fff5f0; padding:20px; border-radius:10px; text-align:center;">
                        <div style="font-size:14px; color:#666;">Total Revenue</div>
                        <div style="font-size:24px; font-weight:bold; color:#ff4d00;">¥${totalRevenue.toFixed(2)}</div>
                    </div>
                </div>
                
                <h3 style="margin-top:30px;">Recent Orders</h3>
                <div style="background:#fff; border:1px solid #eee; border-radius:8px; overflow:hidden;">
                    <table style="width:100%; border-collapse:collapse;">
                        <thead style="background:#f5f5f5;">
                            <tr>
                                <th style="padding:10px; text-align:left;">ID</th>
                                <th style="padding:10px; text-align:left;">Date</th>
                                <th style="padding:10px; text-align:right;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orders.map(o => `
                                <tr style="border-bottom:1px solid #eee;">
                                    <td style="padding:10px;">#${o.OrderID}</td>
                                    <td style="padding:10px;">${o.OrderDate.split(' ')[0]}</td>
                                    <td style="padding:10px; text-align:right;">¥${o.TotalAmount.toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.innerHTML = html;
        }
    </script>
</body>

</html>
