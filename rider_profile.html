<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rider Profile - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page active">
            <div class="page-title">My Profile</div>

            <div class="card mt-20">
                <div class="profile-header" style="display:flex; align-items:center; gap:15px;">
                    <div
                        style="width:60px; height:60px; background:#ddd; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-user" style="font-size:30px; color:#666;"></i>
                    </div>
                    <div>
                        <h3>Rider Name</h3>
                        <p>ID: 4001</p>
                    </div>
                </div>
                <div class="mt-20">
                    <p><strong>Phone:</strong> 138-0000-0000</p>
                    <p><strong>Vehicle:</strong> Electric Scooter</p>
                    <p><strong>Rating:</strong> 4.8/5.0</p>
                </div>
            </div>

            <div class="card mt-20">
                <div class="card-title">Earnings & Stats</div>
                <div style="display:flex; justify-content:space-between; margin-top:10px;">
                    <div style="text-align: center; flex: 1;">
                        <div style="font-size:0.9em; color:#666;">Orders Delivered</div>
                        <div id="profile-completed-count" style="font-size:1.2em; font-weight:bold;">-</div>
                    </div>
                    <div style="text-align: center; flex: 1;">
                        <div style="font-size:0.9em; color:#666;">Total Earnings</div>
                        <div id="profile-total-earnings" style="font-size:1.2em; font-weight:bold;">¥0.00</div>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary full-width mt-20" style="background-color: #dc3545;"
                onclick="window.location.href='index.html'">Logout</button>
        </div>
    </div>

    <div class="common-tab-bar container">
        <a href="rider_home.html" class="tab-item">
            <i class="fas fa-motorcycle"></i>
            <span>Home</span>
        </a>
        <a href="rider_history.html" class="tab-item">
            <i class="fas fa-history"></i>
            <span>History</span>
        </a>
        <a href="rider_profile.html" class="tab-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>
    <script src="scripts/rider_dashboard.js?v=2"></script>
</body>

</html>
