<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="container">
        <div class="page active">
            <div class="checkout-header">
                <h2>Confirm Order</h2>
            </div>
            <div class="cart-list" id="cart-list-container">

                <div class="text-center" style="padding:20px; color:#999;">Cart is empty</div>
            </div>
            <div class="checkout-footer">
                <div class="total-amount" id="cart-total-amount">Total: ¥0</div>
                <button class="btn-submit-order" id="btn-submit-order" style="display:none;">Place Order</button>
            </div>
        </div>
    </div>

    <!-- Load UI Components -->
    <script src="components/topbar.js"></script>
    <script src="components/tabbar.js"></script>
    <script src="components/component-loader.js"></script>
    <script>
        loadUIComponents('auto');
    </script>

    <script src="scripts/data_service.js"></script>
    <script>
        let cart = {};

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
            renderCart();

            document.getElementById('btn-submit-order').addEventListener('click', () => {
                window.location.href = 'customer_payment.html';
            });
        });

        function loadCart() {
            const savedCart = localStorage.getItem('customer_cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-list-container');
            container.innerHTML = '';
            let total = 0;
            let isEmpty = true;

            for (const [restId, data] of Object.entries(cart)) {
                if (data.items.length === 0) continue;
                isEmpty = false;


                const group = document.createElement('div');
                group.className = 'cart-restaurant-group';
                group.innerHTML = `<h4><i class="fas fa-store"></i> ${data.restaurantName}</h4>`;
                container.appendChild(group);

                data.items.forEach(item => {
                    const itemTotal = item.price * item.count;
                    total += itemTotal;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <div class="cart-item-name">${item.name} × ${item.count}</div>
                        <div class="cart-item-price">¥${itemTotal.toFixed(2)}</div>
                    `;
                    container.appendChild(itemDiv);
                });
            }

            const totalEl = document.getElementById('cart-total-amount');
            const submitBtn = document.getElementById('btn-submit-order');

            if (isEmpty) {
                container.innerHTML = '<div class="text-center" style="padding:20px; color:#999;">Cart is empty</div>';
                totalEl.innerText = 'Total: ¥0';
                submitBtn.style.display = 'none';
            } else {
                totalEl.innerText = `Total: ¥${total.toFixed(2)}`;
                submitBtn.style.display = 'block';

                localStorage.setItem('cart_total', total);
            }
        }
    </script>
</body>

</html>
