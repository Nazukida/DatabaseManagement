<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Administrator Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Administrator Login</h1>
        <p class="mt-20">Access administrative dashboards and internal management tools.</p>

        <input type="text" id="admin-username" class="input-box" placeholder="Admin Account">
        <input type="password" id="admin-password" class="input-box" placeholder="Password">

        <div class="mt-20">
            <button onclick="handleAdminLogin()" class="btn btn-primary">Enter</button>
        </div>
    </div>

    <script>
        async function handleAdminLogin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;

            if(!username || !password) {
                alert("Please enter both username and password.");
                return;
            }

            try {
                const response = await fetch('php/login_handler.php?role=admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Admin Login Successful!');
                    const sessionData = { isLoggedIn: true, role: 'Admin', user: data.user };
                    localStorage.setItem('appSession', JSON.stringify(sessionData));
                    window.location.href = 'admin_home.html';
                } else {
                    alert('Login Failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection failed.');
            }
        }
    </script>
</body>
</html>
