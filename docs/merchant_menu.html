<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Menu Management - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .order-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }
    </style>
</head>

<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <div class="page-header"
            style="padding: 10px; background: #fff; border-bottom: 1px solid #eee; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <a href="merchant.html" style="text-decoration: none; color: inherit;">
                    <i class="fas fa-arrow-left" style="cursor:pointer; font-size: 20px; margin-right: 10px;"></i>
                </a>
                <span style="font-size: 18px; font-weight: bold;">Menu Management</span>
            </div>
            <button onclick="MerchantApp.showAddMenuModal()"
                style="background:var(--primary); border:none; padding:8px 15px; border-radius:5px; color:white; cursor:pointer;">+
                Add Item</button>
        </div>
        <div id="menu-list" style="padding: 0 10px;">

        </div>
    </div>

    <!-- Add/Edit Menu Item Modal -->
    <div id="menuModal" class="modal" style="display:none; position:fixed; z-index:200; left:0; top:0; width:100%; height:100%; overflow:auto; background-color:rgba(0,0,0,0.4);">
        <div class="modal-content" style="background-color:#fefefe; margin:15% auto; padding:20px; border:1px solid #888; width:90%; max-width:500px; border-radius:8px;">
            <h3 id="modalTitle">Add Menu Item</h3>
            <form id="menuForm" onsubmit="MerchantApp.saveMenuItem(event)">
                <input type="hidden" id="item-id">
                <div class="form-group" style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Item Name</label>
                    <input type="text" id="item-name" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Price</label>
                    <input type="number" step="0.01" id="item-price" required style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                </div>
                <div class="form-group" style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:bold;">Description</label>
                    <textarea id="item-desc" rows="3" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;"></textarea>
                </div>
                <div class="modal-actions" style="text-align:right; margin-top:20px;">
                    <button type="button" onclick="document.getElementById('menuModal').style.display='none'" style="background:#ccc; color:#333; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; margin-right:10px;">Cancel</button>
                    <button type="submit" style="background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer;">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="scripts/merchant_dashboard.js"></script>





</body>

</html>
