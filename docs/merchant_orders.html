<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Order Management - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Reuse merchant styles */
        .order-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .order-status {
            font-weight: bold;
            color: #ff4d00;
        }

        .order-items {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .order-actions {
            text-align: right;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }

        .btn-accept {
            background: #28a745;
            color: white;
        }

        .btn-ready {
            background: #ffc107;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container" style="margin-top: 20px;">
        <div class="page-header"
            style="padding: 10px; background: #fff; border-bottom: 1px solid #eee; margin-bottom: 20px;">

            <a href="merchant.html" style="text-decoration: none; color: inherit;">
                <i class="fas fa-arrow-left" style="cursor:pointer; font-size: 20px; margin-right: 10px;"></i>
            </a>
            <span style="font-size: 18px; font-weight: bold;">Order Management</span>
        </div>
        <div id="order-list" style="padding: 0 10px;">
            <p style="text-align:center; color:#999;">Loading orders...</p>
        </div>
    </div>

    <!-- Load UI Components -->
    <script src="components/topbar.js"></script>
    <script src="components/tabbar.js"></script>
    <script src="components/component-loader.js"></script>
    <script>
        loadUIComponents('auto');
    </script>


    <script src="scripts/merchant_dashboard.js"></script>
</body>

</html>
