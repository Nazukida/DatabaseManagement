<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rider Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Rider Login</h1>
        <p class="mt-20">Enter your rider account to check delivery tasks and schedules.</p>

        <input type="text" id="rider-id" class="input-box" placeholder="Rider ID (e.g., 4001)">
        <input type="password" id="password" class="input-box" placeholder="Password">

        <div class="mt-20">
            <button onclick="handleLogin()" class="btn btn-primary">Enter</button>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const riderId = document.getElementById('rider-id').value;
            const password = document.getElementById('password').value;

            if(!riderId || !password) {
                alert("Please enter both Rider ID and password.");
                return;
            }

            try {
                const response = await fetch('php/login_handler.php?role=rider', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ riderId, password })
                });

                const data = await response.json();

                if (data.success) {
                    // 1. Validate Data
                    if (!data.user || !data.user.RiderID) {
                        alert('System Error: Server returned invalid rider data.');
                        console.error('Invalid user data:', data);
                        return;
                    }

                    const riderId = data.user.RiderID;
                    const riderName = data.user.Name;

                    // 2. Clear Old Session
                    localStorage.removeItem('appSession');
                    localStorage.removeItem('rider_id');

                    // 3. Set New Session
                    const sessionData = { 
                        isLoggedIn: true, 
                        role: 'Rider', 
                        user: data.user,
                        timestamp: new Date().getTime()
                    };
                    
                    try {
                        localStorage.setItem('appSession', JSON.stringify(sessionData));
                        localStorage.setItem('rider_id', riderId);
                        console.log('Session saved successfully for Rider:', riderId);
                    } catch (e) {
                        alert('Warning: Could not save login session. Please enable cookies/local storage.');
                        console.error('Storage error:', e);
                    }

                    alert('Login Successful! Welcome ' + riderName + ' (ID: ' + riderId + ')');
                    
                    // 4. Redirect with Fallback
                    console.log('Redirecting to rider_home.html?rider_id=' + riderId);
                    window.location.replace('rider_home.html?rider_id=' + riderId); 
                } else {
                    alert('Login Failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection failed.');
            }
        }
    </script>
    <script src="scripts/dev_auto_setup.js"></script>
</body>
</html>
