<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rider Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="php/logout.php" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Rider Login</h1>
        <p class="mt-20">Enter your rider account to check delivery tasks and schedules.</p>

        <input type="text" id="rider-id" class="input-box" placeholder="Rider ID (e.g., 4001)">
        <input type="password" id="password" class="input-box" placeholder="Password">

        <div class="mt-20">
            <button onclick="handleLogin()" class="btn btn-primary">Enter</button>
        </div>
        <div id="login-status" class="mt-20" style="font-weight: bold; color: #333;"></div>
    </div>

    <script>
        async function handleLogin() {
            const riderId = document.getElementById('rider-id').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('login-status');

            if(!riderId || !password) {
                alert("Please enter both Rider ID and password.");
                return;
            }

            statusDiv.innerHTML = "Logging in...";

            try {
                const response = await fetch('php/login_handler.php?role=rider', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ riderId, password })
                });

                const data = await response.json();

                if (data.success) {
                    // 1. Validate Data
                    if (!data.user || !data.user.RiderID) {
                        statusDiv.innerHTML = '<span style="color: red;">System Error: Server returned invalid rider data.</span>';
                        console.error('Invalid user data:', data);
                        return;
                    }

                    const riderId = data.user.RiderID;
                    const riderName = data.user.Name;

                    // 2. Clear Old Session
                    localStorage.removeItem('appSession');
                    localStorage.removeItem('rider_id');

                    // 3. Set New Session
                    const sessionData = { 
                        isLoggedIn: true, 
                        role: 'Rider', 
                        user: data.user,
                        timestamp: new Date().getTime()
                    };
                    
                    try {
                        localStorage.setItem('appSession', JSON.stringify(sessionData));
                        localStorage.setItem('rider_id', riderId);
                        console.log('Session saved successfully for Rider:', riderId);
                    } catch (e) {
                        console.error('Storage error:', e);
                        statusDiv.innerHTML += '<br><span style="color: orange;">Warning: Could not save session.</span>';
                    }

                    statusDiv.innerHTML = '<span style="color: green;">Login Successful! Query Time: ' + (data.query_time || 'N/A') + '</span>';
                    
                    // 4. Redirect with Fallback
                    console.log('Redirecting to rider_home.html?rider_id=' + riderId);
                    setTimeout(() => { window.location.replace('rider_home.html?rider_id=' + riderId); }, 1500);
                } else {
                    statusDiv.innerHTML = '<span style="color: red;">Login Failed: ' + data.message + '</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<span style="color: red;">Connection failed.</span>';
            }
        }
    </script>
    <script src="scripts/dev_auto_setup.js"></script>
</body>
</html>
