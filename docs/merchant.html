<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Merchant Center - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Layout */
        .dashboard {
            width: 92%;
            max-width: 870px;
            margin: 40px auto;
            display: flex;
            gap: 20px;
            justify-content: space-between;
            flex-wrap: wrap;
            /* Wrap content */
        }

        .card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            /* Default width */
            max-width: 280px;
            /* Max width */
            min-height: 400px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card-head {
            margin-bottom: 20px;
        }

        .card-title {
            font-weight: 700;
            color: #000;
            font-size: 22px;
        }

        .card-info {
            flex-grow: 1;
            font-size: 16px;
        }

        .card-foot {
            text-align: center;
        }

        .btn-banner {
            display: inline-block;
            padding: 14px 26px;
            background: var(--primary);
            color: #fff;
            border-radius: 16px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(255, 195, 0, 0.35);
            transition: 0.25s;
        }

        .btn-banner:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Tab Bar */
        .common-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55px;
            background-color: #fff;
            display: flex;
            border-top: 1px solid #eee;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
        }

        .tab-item.active {
            color: #ff4d00;
        }

        .tab-item i {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .tab-item span {
            font-size: 12px;
        }
    </style>
</head>

<body>


    <div class="container">

        <div class="page dashboard" id="home-page">
            <div style="width:100%; margin-bottom:20px;">
                <h2 id="welcome-msg">Welcome, Merchant</h2>
            </div>

            <div class="card">
                <div class="card-head">
                    <div class="card-title">Order Management</div>
                </div>
                <div class="card-info">
                    <strong>Information：</strong><br>
                    Manage and process customer orders.
                </div>
                <div class="card-foot">
                    <a class="btn-banner" href="merchant_orders.html">Start Management</a>
                </div>
            </div>


            <div class="card">
                <div class="card-head">
                    <div class="card-title">Menu Management</div>
                </div>
                <div class="card-info">
                    <strong>Information：</strong><br>
                    Add, edit, and organize your menu items.
                </div>
                <div class="card-foot">
                    <a class="btn-banner" href="merchant_menu.html">Start Management</a>
                </div>
            </div>


            <div class="card">
                <div class="card-head">
                    <div class="card-title">Sales Management</div>
                </div>
                <div class="card-info">
                    <strong>Information：</strong><br>
                    View and analyze sales data.
                </div>
                <div class="card-foot">
                    <a class="btn-banner" href="merchant_sales.html">Open Data</a>
                </div>
            </div>
        </div>
    </div>


    <div class="common-tab-bar">
        <a href="merchant.html" class="tab-item active">
            <i class="fas fa-utensils"></i>
            <span>Home</span>
        </a>
        <a href="merchant_profile.html" class="tab-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- Load UI Components -->
    <script src="components/topbar.js"></script>
    <script src="components/tabbar.js"></script>
    <script src="components/component-loader.js"></script>
    <script>
        loadUIComponents('auto');
    </script>


    <script src="scripts/merchant_dashboard.js"></script>
</body>

</html>
