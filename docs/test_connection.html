<!DOCTYPE html>
<html>
<body>
    <h1>Connection Test</h1>
    <button onclick="test()">Test Connection</button>
    <div id="result"></div>
    <script>
        function test() {
            fetch('php/checkout_handler.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId: 24, cart: {1: {items: [{menuItemId: 1, count: 1, price: 10}]}}, paymentMethod: 'Test'})
            })
            .then(r => r.text())
            .then(t => document.getElementById('result').innerText = t)
            .catch(e => document.getElementById('result').innerText = e);
        }
    </script>
</body>
</html>
