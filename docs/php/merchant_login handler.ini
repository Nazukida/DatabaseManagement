<?php
// 引入数据库连接配置文件
include('config.php');

// 获取 POST 请求的数据
$data = json_decode(file_get_contents("php://input"), true);

// 获取商家 ID 和密码
$restaurantId = $data['restaurantId'];
$password = $data['password'];

// 检查商家 ID 和密码是否为空
if (empty($restaurantId) || empty($password)) {
    echo json_encode(['success' => false, 'message' => 'Please enter both Restaurant ID and password.']);
    exit;
}

// 通过商家 ID 查找数据库中的商家信息
$sql = "SELECT * FROM restaurants WHERE restaurant_id = ?";  // 假设商家表名为 restaurants
$stmt = $conn->prepare($sql);
$stmt->bind_param("s", $restaurantId);
$stmt->execute();
$result = $stmt->get_result();

if ($result->num_rows > 0) {
    $user = $result->fetch_assoc();
    
    // 验证密码
    if (password_verify($password, $user['password'])) {
        // 登录成功，返回用户信息
        echo json_encode(['success' => true, 'message' => 'Login Successful!', 'user' => $user]);
    } else {
        // 密码错误
        echo json_encode(['success' => false, 'message' => 'Incorrect password.']);
    }
} else {
    // 找不到该商家 ID
    echo json_encode(['success' => false, 'message' => 'Restaurant ID not found.']);
}

$conn->close();
?>
