<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Home - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="container">
        <div class="page active">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search restaurants, food...">
            </div>
            <div class="restaurant-list" id="restaurant-list-container">

            </div>
        </div>
    </div>

    <!-- Load UI Components -->
    <script src="components/topbar.js"></script>
    <script src="components/tabbar.js"></script>
    <script src="components/component-loader.js"></script>
    <script>
        loadUIComponents('auto');
    </script>

    <script src="scripts/data_service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderRestaurants();
        });

        function renderRestaurants() {
            const container = document.getElementById('restaurant-list-container');
            const restaurants = MockDB.getRestaurants();

            container.innerHTML = '';
            restaurants.forEach(rest => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';

                card.onclick = () => window.location.href = `customer_menu.html?id=${rest.RestaurantID}`;

                card.innerHTML = `
                    <h3>${rest.RestaurantName}</h3>
                    <div class="restaurant-meta">
                        <span><i class="fas fa-star"></i> ${rest.AverageRating} | ${rest.Description}</span>
                        <span>Delivery: ¥${rest.DeliveryFee}</span>
                    </div>
                    <div class="restaurant-tags">
                        <span class="tag-discount">${rest.BusinessStatus}</span>
                        <span class="tag-discount">Min Order: ¥${rest.MinimumOrderAmount}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>

</html>
