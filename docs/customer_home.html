<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Home - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="php/logout.php" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page active">
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Search restaurants, food...">
            </div>
            <div class="restaurant-list" id="restaurant-list-container">
                <p style="text-align:center; padding:20px;">Loading restaurants...</p>
                <script>
                    // Redirect to PHP version if accessed directly
                    window.location.href = 'php/customer_home.php';
                </script>
            </div>
        </div>
    </div>

    <div class="common-tab-bar container">
        <a href="customer_home.html" class="tab-item active">
            <i class="fas fa-utensils"></i>
            <span>Home</span>
        </a>
        <a href="customer_orders.html" class="tab-item">
            <i class="fas fa-receipt"></i>
            <span>Orders</span>
        </a>
        <a href="customer_cart.html" class="tab-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
        </a>
        <a href="customer_profile.html" class="tab-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderRestaurants();
        });

        function renderRestaurants() {
            const container = document.getElementById('restaurant-list-container');
            const restaurants = MockDB.getRestaurants();

            container.innerHTML = '';
            restaurants.forEach(rest => {
                const card = document.createElement('div');
                card.className = 'restaurant-card';

                card.onclick = () => window.location.href = `customer_menu.html?id=${rest.RestaurantID}`;

                card.innerHTML = `
                    <h3>${rest.RestaurantName}</h3>
                    <div class="restaurant-meta">
                        <span><i class="fas fa-star"></i> ${rest.AverageRating} | ${rest.Description}</span>
                        <span>Delivery: ¥${rest.DeliveryFee}</span>
                    </div>
                    <div class="restaurant-tags">
                        <span class="tag-discount">${rest.BusinessStatus}</span>
                        <span class="tag-discount">Min Order: ¥${rest.MinimumOrderAmount}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>

</html>
