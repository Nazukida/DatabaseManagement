<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="container">
        <div class="page active">
            <div class="page-header">
                <a href="customer_cart.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h3>Payment</h3>
            </div>
            <div class="payment-content">
                <div class="payment-amount">
                    <p>Total to Pay</p>
                    <h1 id="pay-amount-display">¥0.00</h1>
                </div>
                <div class="payment-methods">
                    <div class="method-item">
                        <i class="fab fa-alipay" style="color: #1678ff;"></i>
                        <span>Alipay</span>
                        <input type="radio" name="payment" value="Alipay" checked>
                    </div>
                    <div class="method-item">
                        <i class="fab fa-weixin" style="color: #07c160;"></i>
                        <span>WeChat Pay</span>
                        <input type="radio" name="payment" value="WeChat">
                    </div>
                    <div class="method-item">
                        <i class="fas fa-credit-card" style="color: #ff9900;"></i>
                        <span>Credit Card</span>
                        <input type="radio" name="payment" value="Card">
                    </div>
                </div>
                <button class="btn-pay-now" onclick="processPayment()">Pay Now</button>
            </div>
        </div>
    </div>

    <!-- Load UI Components -->
    <script src="components/topbar.js"></script>
    <script src="components/tabbar.js"></script>
    <script src="components/component-loader.js"></script>
    <script>
        loadUIComponents('auto');
    </script>


    <script src="scripts/data_service.js"></script>
    <script>
        let cart = {};
        let totalAmount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const savedCart = localStorage.getItem('customer_cart');
            if (savedCart) cart = JSON.parse(savedCart);

            totalAmount = parseFloat(localStorage.getItem('cart_total') || '0');
            document.getElementById('pay-amount-display').innerText = `¥${totalAmount.toFixed(2)}`;
        });

        function processPayment() {
            // 1. Prepare Data
            const userId = 24; // Hardcoded for testing as requested
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            
            // Ensure cart is valid
            if (!cart || Object.keys(cart).length === 0) {
                alert("Cart is empty!");
                return;
            }

            const payload = {
                userId: userId,
                cart: cart,
                paymentMethod: paymentMethod
            };

            console.log('Sending Order Payload:', payload);

            // 2. Send Request (Logic from test_connection.html)
            fetch('php/checkout_handler.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            })
            .then(response => response.text()) // Get raw text first to debug PHP errors
            .then(text => {
                console.log('Raw Server Response:', text);
                
                try {
                    const data = JSON.parse(text);
                    if (data.success) {
                        alert('Payment Successful! Order ID(s): ' + data.orders.join(', '));
                        
                        // Clear cart and redirect
                        localStorage.removeItem('customer_cart');
                        localStorage.removeItem('cart_total');
                        window.location.href = 'customer_orders.html';
                    } else {
                        alert('Server Error: ' + (data.message || 'Unknown error'));
                    }
                } catch (e) {
                    console.error('JSON Parse Error:', e);
                    alert('Critical Error: Server returned non-JSON response.\n\nResponse:\n' + text.substring(0, 200) + '...');
                }
            })
            .catch(error => {
                console.error('Network/Fetch Error:', error);
                alert('Network Error: ' + error.message);
            });
        }
    </script>
</body>

</html>
