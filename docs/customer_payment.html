<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page active">
            <div class="page-header">
                <a href="customer_cart.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h3>Payment</h3>
            </div>
            <div class="payment-content">
                <div class="payment-amount">
                    <p>Total to Pay</p>
                    <h1 id="pay-amount-display">¥0.00</h1>
                </div>
                <div class="payment-methods">
                    <div class="method-item">
                        <i class="fab fa-alipay" style="color: #1678ff;"></i>
                        <span>Alipay</span>
                        <input type="radio" name="payment" value="Alipay" checked>
                    </div>
                    <div class="method-item">
                        <i class="fab fa-weixin" style="color: #07c160;"></i>
                        <span>WeChat Pay</span>
                        <input type="radio" name="payment" value="WeChat">
                    </div>
                    <div class="method-item">
                        <i class="fas fa-credit-card" style="color: #ff9900;"></i>
                        <span>Credit Card</span>
                        <input type="radio" name="payment" value="Card">
                    </div>
                </div>
                <button class="btn-pay-now" onclick="processPayment()">Pay Now</button>
            </div>
        </div>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        let cart = {};
        let totalAmount = 0;

        document.addEventListener('DOMContentLoaded', () => {
            const savedCart = localStorage.getItem('customer_cart');
            if (savedCart) cart = JSON.parse(savedCart);

            totalAmount = parseFloat(localStorage.getItem('cart_total') || '0');
            document.getElementById('pay-amount-display').innerText = `¥${totalAmount.toFixed(2)}`;
        });

        function processPayment() {
            const currentUser = MockDB.users[0];
            const orderDate = new Date().toISOString().slice(0, 19).replace('T', ' ');


            const newOrders = [];

            for (const [restId, data] of Object.entries(cart)) {
                if (data.items.length === 0) continue;

                let orderTotal = 0;
                data.items.forEach(i => orderTotal += i.price * i.count);

                const newOrder = {
                    OrderID: Math.floor(Math.random() * 10000),
                    UserID: currentUser.UserID,
                    RestaurantID: parseInt(restId),
                    OrderStatus: 'Pending',
                    OrderDate: orderDate,
                    TotalAmount: orderTotal,
                    DeliveryAddressID: 1,
                    PaymentID: 1,
                    Items: data.items.map(i => ({
                        MenuItemID: i.menuItemId,
                        ItemName: i.name,
                        Quantity: i.count,
                        Subtotal: i.price * i.count
                    }))
                };
                newOrders.push(newOrder);
            }


            const existingOrders = JSON.parse(localStorage.getItem('local_orders') || '[]');
            localStorage.setItem('local_orders', JSON.stringify([...existingOrders, ...newOrders]));

            alert('Payment Successful! Orders have been generated.');


            localStorage.removeItem('customer_cart');
            localStorage.removeItem('cart_total');

            window.location.href = 'customer_orders.html';
        }
    </script>
</body>

</html>
