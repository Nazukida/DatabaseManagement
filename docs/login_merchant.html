<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Merchant Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="php/logout.php" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Merchant Login</h1>
        <p class="mt-20">Access your merchant dashboard to maintain menus and view incoming orders.</p>

        <input type="text" id="merchant-id" class="input-box" placeholder="Restaurant ID (e.g., 101)">
        <input type="password" id="password" class="input-box" placeholder="Password">

        <div class="mt-20">
            <button onclick="handleLogin()" class="btn btn-primary">Enter</button>
        </div>
        <div id="login-status" class="mt-20" style="font-weight: bold; color: #333;"></div>
    </div>

    <script>
        async function handleLogin() {
            const restaurantId = document.getElementById('merchant-id').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('login-status');

            if(!restaurantId || !password) {
                statusDiv.innerHTML = '<span style="color: red;">Please enter both Restaurant ID and password.</span>';
                return;
            }

            statusDiv.innerHTML = "Logging in...";

            try {
                const response = await fetch('php/login_handler.php?role=merchant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ restaurantId, password })
                });

                const data = await response.json();

                if (data.success) {
                    // 1. Validate Data
                    if (!data.user || !data.user.RestaurantID) {
                        statusDiv.innerHTML = '<span style="color: red;">System Error: Server returned invalid merchant data.</span>';
                        console.error('Invalid user data:', data);
                        return;
                    }

                    const restaurantId = data.user.RestaurantID;
                    const restaurantName = data.user.RestaurantName;

                    // 2. Clear Old Session
                    localStorage.removeItem('appSession');
                    localStorage.removeItem('restaurant_id');
                    sessionStorage.removeItem('restaurant_id');

                    // 3. Set New Session
                    const sessionData = { 
                        isLoggedIn: true, 
                        role: 'Merchant', 
                        user: data.user,
                        timestamp: new Date().getTime()
                    };
                    
                    try {
                        localStorage.setItem('appSession', JSON.stringify(sessionData));
                        // We use sessionStorage for the active ID to prevent cross-tab issues
                        sessionStorage.setItem('restaurant_id', restaurantId);
                        console.log('Session saved successfully for Merchant:', restaurantId);
                    } catch (e) {
                        console.error('Storage error:', e);
                    }

                    statusDiv.innerHTML = '<span style="color: green;">Login Successful! Query Time: ' + (data.query_time || 'N/A') + '</span>';
                    
                    // 4. Redirect with Fallback
                    setTimeout(() => { window.location.replace('merchant.html?restaurant_id=' + restaurantId); }, 1500);
                } else {
                    statusDiv.innerHTML = '<span style="color: red;">Login Failed: ' + data.message + '</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<span style="color: red;">Connection failed.</span>';
            }
        }
    </script>
</body>
</html>
