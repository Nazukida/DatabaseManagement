<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Customer Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="php/logout.php" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Customer Login</h1>
        <p class="mt-20">Enter your customer account to browse restaurants and view available meals.</p>

        <input type="text" id="username" class="input-box" placeholder="Username">
        <input type="password" id="password" class="input-box" placeholder="Password">

        <div class="mt-20">
            <button onclick="handleLogin()" class="btn btn-primary">Enter</button>
        </div>
        <div id="login-status" class="mt-20" style="font-weight: bold; color: #333;"></div>
    </div>

    <script>
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('login-status');

            if(!username || !password) {
                alert("Please enter both username and password.");
                return;
            }

            statusDiv.innerHTML = "Logging in...";

            try {
                const response = await fetch('php/login_handler.php?role=customer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerHTML = '<span style="color: green;">Login Successful! Query Time: ' + (data.query_time || 'N/A') + '</span>';
                    // alert('Login Successful! Welcome ' + data.user.Username + '\nQuery Time: ' + (data.query_time || 'N/A'));
                    const sessionData = { isLoggedIn: true, role: 'Customer', user: data.user };
                    localStorage.setItem('appSession', JSON.stringify(sessionData));
                    setTimeout(() => { window.location.href = 'php/customer_home.php'; }, 1500);
                } else {
                    statusDiv.innerHTML = '<span style="color: red;">Login Failed: ' + data.message + '</span>';
                    // alert('Login Failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection failed. Is PHP running?');
            }
        }
    </script>
</body>
</html>
