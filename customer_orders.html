<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="body container">
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page active">
            <div class="page-header">
                <h2>My Orders</h2>
            </div>
            <div class="order-empty" id="order-empty-state" style="display:none;">
                <i class="fas fa-box-open"></i>
                <p>No Orders Yet</p>
                <p class="order-empty-tip">Go ahead and order some delicious food～</p>
            </div>
            <div id="order-history-container">

            </div>
        </div>
    </div>

    <div class="common-tab-bar container">
        <a href="customer_home.html" class="tab-item">
            <i class="fas fa-utensils"></i>
            <span>Home</span>
        </a>
        <a href="customer_orders.html" class="tab-item active">
            <i class="fas fa-receipt"></i>
            <span>Orders</span>
        </a>
        <a href="customer_cart.html" class="tab-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
        </a>
        <a href="customer_profile.html" class="tab-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
        });

        function renderOrders() {
            const container = document.getElementById('order-history-container');
            const emptyState = document.getElementById('order-empty-state');



            const userId = 12345;
            let orders = MockDB.orders.filter(o => o.UserID === userId);


            const localOrders = JSON.parse(localStorage.getItem('local_orders') || '[]');
            orders = [...localOrders, ...orders];

            if (orders.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            container.innerHTML = '';


            orders.sort((a, b) => new Date(b.OrderDate) - new Date(a.OrderDate));

            orders.forEach(order => {
                const itemsDesc = order.Items.map(i => `${i.ItemName || 'Item'} x${i.Quantity}`).join(', ');
                const restaurantName = MockDB.restaurants.find(r => r.RestaurantID === order.RestaurantID)?.RestaurantName || 'Unknown Restaurant';

                const html = `
                    <div class="order-card" style="background:white; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                        <h3 style="border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:10px; font-size:16px;">${restaurantName}</h3>
                        <p style="color:#666; font-size:13px; margin:5px 0;">${itemsDesc}</p>
                        <div style="display:flex; justify-content:space-between; margin-top:10px;">
                            <span style="color:#999; font-size:12px;">${order.OrderDate}</span>
                            <span style="font-weight:bold; font-size:16px;">¥${order.TotalAmount.toFixed(2)}</span>
                        </div>
                        <div style="margin-top:10px; text-align:right;">
                            <span style="color:orange; font-size:12px; font-weight:bold; background:#fff7e6; padding:4px 8px; border-radius:4px;">${order.OrderStatus}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }
    </script>
</body>

</html>
