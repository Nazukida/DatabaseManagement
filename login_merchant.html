<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Merchant Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Merchant Login</h1>
        <p class="mt-20">Access your merchant dashboard to maintain menus and view incoming orders.</p>

        <input type="text" id="merchant-id" class="input-box" placeholder="Restaurant ID (e.g., 101)">
        <input type="password" id="password" class="input-box" placeholder="Password">

        <div class="mt-20">
            <button onclick="handleLogin()" class="btn btn-primary">Enter</button>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const restaurantId = document.getElementById('merchant-id').value;
            const password = document.getElementById('password').value;

            if(!restaurantId || !password) {
                alert("Please enter both Restaurant ID and password.");
                return;
            }

            try {
                const response = await fetch('php/login_handler.php?role=merchant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ restaurantId, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Login Successful! ' + data.user.RestaurantName);
                    const sessionData = { isLoggedIn: true, role: 'Merchant', user: data.user };
                    localStorage.setItem('appSession', JSON.stringify(sessionData));
                    window.location.href = 'merchant.html';
                } else {
                    alert('Login Failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection failed.');
            }
        }
    </script>
</body>
</html>
