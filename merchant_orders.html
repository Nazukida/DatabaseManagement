<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Order Management - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 复用 merchant.html 的样式 */
        .order-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .order-status {
            font-weight: bold;
            color: #ff4d00;
        }

        .order-items {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .order-actions {
            text-align: right;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            margin-left: 5px;
        }

        .btn-accept {
            background: #28a745;
            color: white;
        }

        .btn-ready {
            background: #ffc107;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <div class="page-header"
            style="padding: 10px; background: #fff; border-bottom: 1px solid #eee; margin-bottom: 20px;">

            <a href="merchant.html" style="text-decoration: none; color: inherit;">
                <i class="fas fa-arrow-left" style="cursor:pointer; font-size: 20px; margin-right: 10px;"></i>
            </a>
            <span style="font-size: 18px; font-weight: bold;">Order Management</span>
        </div>
        <div id="merchant-order-list" style="padding: 0 10px;">
            <p style="text-align:center; color:#999;">Loading orders...</p>
        </div>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        const currentRestaurantId = 1;


        window.onload = function () {
            renderMerchantOrders();
        };

        function renderMerchantOrders() {
            const container = document.getElementById('merchant-order-list');
            const orders = MockDB.getOrdersByRestaurant(currentRestaurantId);

            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">No orders found.</p>';
                return;
            }

            container.innerHTML = '';
            orders.forEach(order => {
                const itemsDesc = order.Items.map(i => `${i.ItemName} x${i.Quantity}`).join(', ');

                let actionBtns = '';
                if (order.OrderStatus === 'Pending') {
                    actionBtns = `<button class="btn-action btn-accept" onclick="updateStatus(${order.OrderID}, 'Cooking')">Accept & Cook</button>`;
                } else if (order.OrderStatus === 'Cooking') {
                    actionBtns = `<button class="btn-action btn-ready" onclick="updateStatus(${order.OrderID}, 'ReadyForPickup')">Mark Ready</button>`;
                }

                const html = `
                    <div class="order-card">
                        <div class="order-header">
                            <span>Order #${order.OrderID}</span>
                            <span class="order-status">${order.OrderStatus}</span>
                        </div>
                        <div class="order-items">
                            ${itemsDesc}
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-weight:bold;">¥${order.TotalAmount.toFixed(2)}</span>
                            <div class="order-actions">
                                ${actionBtns}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function updateStatus(orderId, status) {
            if (confirm(`Update Order #${orderId} to ${status}?`)) {
                MockDB.updateOrderStatus(orderId, status);
                renderMerchantOrders();
            }
        }
    </script>
</body>

</html>
