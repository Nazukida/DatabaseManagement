<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Merchant Profile - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 个人中心样式 */
        .profile-header {
            background-color: #ff4d00;
            color: #fff;
            padding: 30px 16px;
            text-align: center;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #fff;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar i {
            font-size: 36px;
            color: #ff4d00;
        }

        .user-name {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .user-phone {
            font-size: 14px;
            opacity: 0.9;
        }

        .profile-menu {
            background-color: #fff;
            margin-top: 16px;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        .menu-item {
            padding: 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .menu-item:hover {
            background-color: #fafafa;
        }

        .menu-item i:first-child {
            margin-right: 10px;
            color: #666;
        }

        .menu-item .fa-chevron-right {
            font-size: 16px;
            color: #bbb;
        }

        /* Tab栏 */
        .common-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55px;
            background-color: #fff;
            display: flex;
            border-top: 1px solid #eee;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
            transition: color 0.2s;
            text-decoration: none;
            /* Remove underline from links */
        }

        .tab-item.active {
            color: #ff4d00;
        }

        .tab-item i {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .tab-item span {
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page" id="profile-page">
            <div class="profile-header">
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-name">Merchant User</div>
                <div class="user-phone">Phone: 138****8888</div>
            </div>
            <div class="profile-menu">
                <div class="menu-item">
                    <span><i class="fas fa-cog"></i> Settings</span>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="menu-item">
                    <span><i class="fas fa-question-circle"></i> Help Center</span>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>


    <div class="common-tab-bar">
        <a href="merchant.html" class="tab-item">
            <i class="fas fa-utensils"></i>
            <span>Home</span>
        </a>
        <a href="merchant_profile.html" class="tab-item active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </div>
</body>

</html>
