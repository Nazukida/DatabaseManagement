<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Rider Login - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container text-center">
        <h1 class="page-title">Rider Login</h1>
        <p class="mt-20">Enter your rider account to check delivery tasks and schedules.</p>

        <input type="text" id="rider-id" class="input-box" placeholder="Rider ID (e.g., 4001)" value="4001">
        <input type="password" id="password" class="input-box" placeholder="Password" value="password">

        <div class="mt-20">
            <button onclick="handleLogin()" class="btn btn-primary">Enter</button>
        </div>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        function handleLogin() {
            const riderId = parseInt(document.getElementById('rider-id').value);
            const rider = MockDB.getRider(riderId);

            if (rider) {
                alert('Login Successful! Welcome ' + rider.Name);
                window.location.href = 'rider_home.html';
            } else {
                alert('Invalid Rider ID. Try 4001.');
            }
        }
    </script>
</body>

</html>
