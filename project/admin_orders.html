<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            color: white;
        }

        .btn-approve {
            background-color: #28a745;
        }

        .btn-reject {
            background-color: #dc3545;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }
    </style>
</head>

<body class="body container">
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page active">
            <h1 class="page-title text-center">Order Management</h1>

            <div class="section">
                <p>Display customer and rider operation information on orders. Double-click to edit content.</p>

                <table class="data-table card mt-20" style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>User ID</th>
                            <th>Rider ID</th>
                            <th>Customer Comment</th>
                            <th>Rider Action</th>
                            <th>Order Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="order-table-body">

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="common-tab-bar container">
        <a href="admin_home.html" class="tab-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="admin_orders.html" class="tab-item active">
            <i class="fas fa-receipt"></i>
            <span>Orders</span>
        </a>
        <a href="admin_merchants.html" class="tab-item">
            <i class="fas fa-store"></i>
            <span>Merchants</span>
        </a>
    </div>

    <script src="scripts/admin_data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tbody = document.getElementById('order-table-body');

            orderData.forEach(order => {
                const statusClass = `status-${order.status}`;
                const row = document.createElement('tr');
                row.className = 'editable';
                row.innerHTML = `
                    <td data-field="order_id">${order.order_id}</td>
                    <td data-field="user_id">${order.user_id}</td>
                    <td data-field="rider_id">${order.rider_id}</td>
                    <td data-field="customer_comment">${order.customer_comment}</td>
                    <td data-field="rider_action">${order.rider_action}</td>
                    <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                    <td class="action-buttons">
                        <button class="action-btn btn-sm btn-approve">Approve</button>
                        <button class="action-btn btn-sm btn-reject">Reject</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            initEditableCells();
            handleActionButtonClick();
        });
    </script>
</body>

</html>
