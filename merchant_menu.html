<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Menu Management - YouShi LinLi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .order-card {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }
    </style>
</head>

<body>
    <div class="unified-top-bar">
        <div class="top-bar-content">
            <span class="brand-name">YouShi LinLi</span>
            <div class="top-nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="index.html" onclick="alert('Logged out successfully!')">Logout</a>
            </div>
        </div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <div class="page-header"
            style="padding: 10px; background: #fff; border-bottom: 1px solid #eee; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center;">
            <div>
                <a href="merchant.html" style="text-decoration: none; color: inherit;">
                    <i class="fas fa-arrow-left" style="cursor:pointer; font-size: 20px; margin-right: 10px;"></i>
                </a>
                <span style="font-size: 18px; font-weight: bold;">Menu Management</span>
            </div>
            <button onclick="showAddMenuModal()"
                style="background:var(--primary); border:none; padding:8px 15px; border-radius:5px; color:white; cursor:pointer;">+
                Add Item</button>
        </div>
        <div id="menu-list" style="padding: 0 10px;">

        </div>
    </div>

    <script src="scripts/data_service.js"></script>
    <script>
        const currentRestaurantId = 1;

        window.onload = function () {
            renderMenu();
        };

        function renderMenu() {
            const container = document.getElementById('menu-list');
            const menu = MockDB.getMenuByRestaurantID(currentRestaurantId);

            if (menu.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999;">No menu items.</p>';
                return;
            }

            container.innerHTML = '';
            menu.forEach(item => {
                const html = `
                    <div class="order-card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:bold; font-size:16px;">${item.ItemName}</div>
                            <div style="color:#666; font-size:12px;">${item.ItemDescription}</div>
                            <div style="color:#ff4d00; font-weight:bold; margin-top:5px;">¥${item.Price.toFixed(2)}</div>
                        </div>
                        <button onclick="deleteMenuItem(${item.MenuItemID})" style="background:#ff4d4d; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Delete</button>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function showAddMenuModal() {
            const name = prompt("Enter Item Name:");
            if (!name) return;
            const desc = prompt("Enter Description:");
            const price = parseFloat(prompt("Enter Price:"));
            if (isNaN(price)) { alert("Invalid Price"); return; }

            const newItem = {
                RestaurantID: currentRestaurantId,
                ItemName: name,
                ItemDescription: desc,
                Price: price,
                ItemImage: "",
                StockStatus: "In Stock"
            };

            MockDB.addMenuItem(newItem);
            renderMenu();
        }

        function deleteMenuItem(id) {
            if (confirm("Are you sure you want to delete this item?")) {
                MockDB.deleteMenuItem(id);
                renderMenu();
            }
        }
    </script>
</body>

</html>
